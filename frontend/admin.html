<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLS Attendance - Admin</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div class="container">
        <div style="text-align: center; margin-bottom: 1rem;">
            <img src="../gls-attendance.png" alt="GLS Logo" style="max-width: 150px;">
        </div>
        <h2>Teacher Dashboard</h2>

        <div class="card">
            <h3>Start Attendance Session</h3>
            <form id="session-form">
                <div class="form-group">
                    <label for="subject">Subject Name</label>
                    <input type="text" id="subject" required placeholder="e.g. Advanced Java">
                </div>
                <button type="submit" class="btn-primary">Generate Code</button>
            </form>

            <div id="active-session" class="hidden">
                <div class="code-display">
                    Code: <span id="display-code"></span>
                </div>
                <p>Expires in: <span id="session-timer">02:00</span></p>
                <button id="btn-download" class="btn-secondary">Download Excel</button>
            </div>
        </div>

        <div class="card">
            <h3>Manual Attendance</h3>
            <div class="form-group">
                <label for="division">Select Division</label>
                <select id="division">
                    <option value="">--Select Division--</option>
                    <option value="Alpha">Alpha</option>
                    <option value="Beta">Beta</option>
                    <option value="Gamma">Gamma</option>
                </select>
            </div>

            <div class="form-group">
                <label for="student-list">Select Student</label>
                <select id="student-list" disabled>
                    <option value="">--Select Division First--</option>
                </select>
            </div>

            <button id="btn-manual-mark" class="btn-primary" disabled>Mark Present Manually</button>
        </div>

        <div id="message" class="message hidden"></div>
    </div>

    <script src="admin.js"></script>

</body>

</html>
